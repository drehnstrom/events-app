apiVersion: batch/v1
kind: Job
metadata:
  name: db-initializer
spec:
  template:
    spec:
      containers:
      - image: drehnstrom/events-job:v2.0
        name: db-init-job
        imagePullPolicy: "Always"
        env:
        - name: DBHOST
          value: "database-server-mariadb.events-app.svc.cluster.local"
        - name: DBUSER
          value: "root"
        - name: DBPASSWORD
          valueFrom:
            secretKeyRef:
              name: database-server-mariadb
              key: mariadb-root-password
      restartPolicy: Never
  backoffLimit: 4
