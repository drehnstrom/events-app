---
# Network Policy: Only allow Web pods to communicate with API
# This is the simplest network policy: restrict API ingress to only Web pods
# All other traffic (health checks, external, DNS, etc.) remains unrestricted
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-from-web-only
  namespace: events-app
spec:
  podSelector:
    matchLabels:
      app: events-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: events-web
    ports:
    - protocol: TCP
      port: 8082

